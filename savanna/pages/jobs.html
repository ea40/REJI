<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALX Savanna — Career Gateway &amp; Accessible Job Opportunities</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  <style>
    :root {
      --savanna-primary: #101828;
      --savanna-accent: #00ff88;
      --savanna-border: #e4e7ec;
      --savanna-card-bg: #ffffff;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif;
      margin: 0;
      padding: 0;
    }
    .jobs-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    .jobs-header {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
    }
    .jobs-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 8px 0;
    }
    .jobs-header p {
      color: #475569;
      font-size: 1.1rem;
      margin: 0;
    }
    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }
    .jobs-grid > * {
      min-width: 0;
    }
    .verification-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .verification-banner p {
      margin: 0;
      font-size: 0.95rem;
      color: #1e40af;
    }
    .cert-link {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .cert-link:hover, .cert-link:focus {
      background: #1d4ed8;
      text-decoration: underline;
    }
  </style>
  <script src="../../frontend/digital-bridge-job-card.js"></script>
</head>
<body>
  <div class="jobs-container">
    <header class="jobs-header">
      <h1>Savanna Career Gateway</h1>
      <p>Accessible employment opportunities with disability accommodations across Ethiopia. Verified by ALX Digital Bridge.</p>
    </header>

    <div class="verification-banner" role="region" aria-label="Employer verification notice">
      <div>
        <p><strong>Employer or Recruiter?</strong> You can verify candidate learning badges against our tamper-evident Ed25519 signature protocol.</p>
      </div>
      <div>
        <a href="certificate.html" class="cert-link">View &amp; Verify Learner Certificate →</a>
      </div>
    </div>

    <main class="jobs-grid" role="feed" aria-label="Job opportunities">
      <db-job-card
        job-title="Accessibility QA Engineer"
        employer="Chapa Financial Technologies"
        location="Bole Medhanialem, Addis Ababa"
        salary="45,000 – 65,000 ETB / month"
        deadline="2027-03-31"
        accommodations="Screen reader audited workstations, Flexible hybrid schedule, Assistive keyboards provided"
        badge-url="../../frontend/assets/sample-badge.json"
        description="Build inclusive onchain and mobile payment flows across East Africa. Lead accessibility auditing against ECC digital inclusion standards and WCAG 2.2 AA criteria."
      ></db-job-card>

      <db-job-card
        job-title="Frontend Systems Engineer"
        employer="Ethio Telecom (Digital Division)"
        location="Churchill Road, Addis Ababa"
        salary="50,000 – 75,000 ETB / month"
        deadline="2027-04-15"
        accommodations="Step-free office access, Ethiopian Sign Language (EthSL) interpreters for design ceremonies, Ergonomic dual-monitor setups"
        badge-url="../../frontend/assets/sample-badge.json"
        description="Architect inclusive web applications for Telebirr and nationwide education portals. Implement resilient offline-first caching for 3G rural mobile networks."
      ></db-job-card>

      <db-job-card
        job-title="Inclusive UX Researcher"
        employer="ALX Ethiopia / Savanna Platform"
        location="Lideta Tech Hub, Addis Ababa"
        salary="38,000 – 58,000 ETB / month"
        deadline="2027-05-01"
        accommodations="100% remote option, Asynchronous daily check-ins, Speech-to-text transcription software provided"
        badge-url="../../frontend/assets/sample-badge.json"
        description="Conduct usability sessions with Ethiopian students with visual, motor, and auditory disabilities. Translate user research into open-source component guidelines."
      ></db-job-card>
    </main>
  </div>
</body>
</html>
